<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow"><title>Dağ Döner — Yönetim</title>
  <link rel="icon" href="logos/logo-single.png"><link rel="stylesheet" href="admin.css">
  <script type="module" src="admin.js"></script>
</head>
<body>
  <header><a href="/">← Menüye dön</a><strong>DAĞ DÖNER <small>Yönetim paneli</small></strong><button id="logout" hidden>Çıkış yap</button></header>
  <main>
    <p id="status" role="status" aria-live="polite">Panel yükleniyor…</p>
    <section id="login-panel" class="panel" hidden>
      <h1>Hoş geldin.</h1><p>Menüyü güncellemek için yönetici hesabınla giriş yap.</p>
      <form id="login-form"><label>E-posta<input name="email" type="email" autocomplete="username" required></label><label>Şifre<input name="password" type="password" autocomplete="current-password" required></label><button type="submit">Giriş yap</button></form>
    </section>
    <section id="dashboard" hidden>
      <div class="heading"><div><h1>Menünü yönet.</h1><p>Değişiklikler kaydedildikten sonra menü yeniden açıldığında görünür.</p></div><button id="reload">Yenile</button></div>
      <div class="filters"><label>Ürün ara<input id="filter" type="search" placeholder="Ürün adı…"></label><label>Kategori<select id="category"><option value="all">Tüm kategoriler</option></select></label></div>
      <div class="workspace"><div id="product-list" aria-label="Ürünler"></div>
        <form id="editor" class="panel" hidden>
          <h2 id="editor-title">Ürün düzenle</h2><p id="editor-category"></p>
          <div class="preview"><img id="preview" alt="Ürün görseli" hidden><span id="no-image">Görsel yok / sos illüstrasyonu</span></div>
          <label>Yeni görsel<input id="image-file" type="file" accept="image/jpeg,image/png,image/webp,image/avif"></label><small>JPG, PNG, WebP veya AVIF · En fazla 5 MB</small>
          <label>Ürün adı<input id="name" maxlength="150" required></label>
          <label>Fiyat (₺)<input id="price" type="number" min="0" max="1000000" step="0.01" required></label>
          <label>Açıklama<textarea id="description" rows="5" maxlength="2000"></textarea></label>
          <button id="save" type="submit">Değişiklikleri kaydet</button><p id="save-status" role="status" aria-live="polite"></p>
        </form>
      </div>
    </section>
  </main>
</body>
</html>
