<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dağ Döner – Menü (Foto)</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#1c0b0b;--red:#d4181f;--hot:#ff4b1f;--mustard:#ffc72c;--cream:#fff4dc;--pickle:#2f8a3a;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:calc(76px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--cream);color:var(--ink);font:600 16px/1.45 Archivo,system-ui,sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}
h1,h2,h3{font-family:Anton,Impact,sans-serif;font-weight:400;margin:0;text-transform:uppercase;letter-spacing:.02em}
img{max-width:100%;display:block}
.bar{position:sticky;top:0;z-index:30;background:var(--ink);padding:calc(8px + env(safe-area-inset-top,0px)) 14px 8px;display:flex;align-items:center;gap:12px}
.bar img{width:46px;height:46px;border-radius:50%}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;flex:1}
.chips a{flex:none;color:var(--cream);text-decoration:none;font-weight:800;font-size:.85rem;padding:7px 12px;border:2px solid var(--cream);border-radius:8px;white-space:nowrap}
.chips a.on{background:var(--mustard);border-color:var(--mustard);color:var(--ink)}
a:focus-visible,button:focus-visible{outline:3px solid var(--mustard);outline-offset:2px}
.hero{background:var(--red) radial-gradient(circle,rgba(0,0,0,.14) 2px,transparent 2.5px) 0 0/16px 16px;color:var(--cream);text-align:center;padding:44px 18px 56px;border-bottom:6px solid var(--ink)}
.hero .lm{width:min(300px,70vw);margin:0 auto 18px;border-radius:18px;border:4px solid var(--ink);box-shadow:6px 6px 0 var(--ink);transform:rotate(-2deg)}
.hero h1{font-size:clamp(2.8rem,11vw,6rem);line-height:.95;text-shadow:5px 5px 0 var(--ink)}
.hero h1 em{font-style:normal;color:var(--mustard)}
.hero p{margin:16px auto 0;max-width:36ch;font-size:1.1rem}
.btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:22px}
.btn{font:800 1rem Archivo,sans-serif;text-decoration:none;cursor:pointer;color:var(--ink);background:var(--mustard);border:3px solid var(--ink);border-radius:10px;padding:11px 22px;box-shadow:4px 4px 0 var(--ink)}
.btn.alt{background:var(--cream)}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
main{max-width:1100px;margin:auto;padding:0 16px 50px}
.posters{background:var(--mustard);border:4px solid var(--ink);box-shadow:8px 8px 0 var(--ink);border-radius:18px;padding:30px 18px 38px;margin-top:36px;text-align:center}
.posters h2,.cat h2{font-size:clamp(1.9rem,6vw,2.8rem);display:inline-block;background:var(--mustard);border:3px solid var(--ink);box-shadow:5px 5px 0 var(--ink);padding:4px 16px;transform:rotate(-1deg)}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin:26px auto 0;max-width:640px;text-align:left}
.pgrid figure{margin:0;position:relative;border:4px solid var(--ink);box-shadow:7px 7px 0 var(--ink);background:var(--ink);border-radius:14px;overflow:hidden}
.pgrid figure:nth-child(1){transform:rotate(-1.5deg)}.pgrid figure:nth-child(2){transform:rotate(1.5deg)}
.pgrid figcaption{background:var(--cream);padding:8px 12px;display:flex;justify-content:space-between;font-weight:800;border-top:4px solid var(--ink)}
.pgrid figcaption b{font-family:Anton,sans-serif;font-weight:400;color:var(--red);font-size:1.2rem}
.posters h2{background:var(--red);color:var(--cream)}.sub2{margin:16px 0 0;font-weight:800;font-size:1.05rem}
.cat{padding-top:38px}
.cat .wrap{display:grid;gap:22px;margin-top:20px}
.cat .wrap.has{grid-template-columns:1fr 230px}
.promo{border:4px solid var(--ink);box-shadow:5px 5px 0 var(--ink);border-radius:12px;overflow:hidden;align-self:start;margin:0;transform:rotate(1.2deg)}
.note{margin:12px 0 0;font-weight:600}
.list{display:grid;grid-template-columns:1fr 1fr;gap:6px 36px;align-content:start}
.wrap.has .list{grid-template-columns:1fr}
.r{display:flex;align-items:flex-end;gap:8px;padding:9px 0;break-inside:avoid}
.r .n{font-weight:800;line-height:1.2}.r small{display:block;font-weight:600;font-size:.82rem;color:#5b4540;line-height:1.3;max-width:42ch}
.r .ld{flex:1;min-width:14px;border-bottom:3px dotted var(--ink);margin-bottom:.45em;opacity:.5}
.r .p{font-family:Anton,sans-serif;font-size:1.45rem;color:var(--red);white-space:nowrap;line-height:1}
.star{display:inline-block;background:var(--red);color:#fff;font:800 .68rem Archivo,sans-serif;border-radius:5px;padding:1px 7px;margin-left:6px;vertical-align:middle;transform:rotate(-3deg)}
h3.sub{font-size:1.4rem;margin:20px 0 0;color:var(--pickle)}
footer{background:var(--ink);color:var(--cream);text-align:center;padding:32px 18px calc(32px + env(safe-area-inset-bottom,0px));font-size:.9rem}
footer img{width:84px;margin:0 auto 10px;border-radius:50%}
@media(max-width:760px){.cat .wrap.has{grid-template-columns:1fr}.promo{max-width:300px;transform:none}.list{grid-template-columns:1fr}.pgrid{gap:14px}.bar .chips{padding-right:4px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.card{display:flex;gap:12px;background:#fff;border:3px solid var(--ink);border-radius:14px;box-shadow:5px 5px 0 var(--ink);padding:10px;break-inside:avoid}
.ph{flex:none;width:112px;height:112px;border-radius:10px;border:3px solid var(--ink);display:grid;place-items:center;overflow:hidden;position:relative;background:repeating-linear-gradient(45deg,var(--mustard) 0 10px,#ffd75e 10px 20px)}
.ph span{font-size:2.5rem;margin-top:-8px}
.ph em{position:absolute;bottom:4px;font:800 .6rem Archivo,sans-serif;font-style:normal;background:var(--ink);color:var(--cream);padding:1px 7px;border-radius:4px}
.ph img{width:100%;height:100%;object-fit:cover}
.card .t{flex:1;min-width:0;display:flex;flex-direction:column}
.card .n{font-weight:800;line-height:1.2}
.card small{display:block;font-weight:600;font-size:.82rem;color:#5b4540;line-height:1.3;margin:3px 0 6px}
.card .p{margin-top:auto;font-family:Anton,sans-serif;font-size:1.5rem;color:var(--red);line-height:1}
@media(max-width:760px){.cards{grid-template-columns:1fr}.ph{width:96px;height:96px}}
@page{size:A4;margin:10mm}
@media print{
 body{background:#fff;font-size:10.5pt}
 .bar,.btns,.hero p{display:none!important}
 .hero{padding:10px;border-bottom-width:3px}.hero .lm{width:150px;margin-bottom:8px}.hero h1{font-size:30pt;text-shadow:3px 3px 0 var(--ink)}
 main{max-width:none;padding:0}
 .posters{break-after:page;margin-top:14px;box-shadow:none}.pgrid{max-width:none}
 .cat{padding-top:14px;break-inside:avoid-page}
 .cat h2{font-size:22pt}.r{padding:4px 0}.r .p{font-size:14pt}.r small{font-size:8pt}
 .cat .wrap.has{grid-template-columns:1fr 150px}.cat .wrap{margin-top:10px}
 footer{padding:10px;background:#fff;color:var(--ink)}footer img{width:50px}
 .cards{gap:10px}.ph{width:76px;height:76px}.card{padding:6px;gap:8px;box-shadow:3px 3px 0 var(--ink)}.card .p{font-size:13pt}.card small{font-size:8pt}.ph span{font-size:1.6rem}
}
</style>
</head>
